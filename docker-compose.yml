services:
  mysql-produit:
    image: mysql:8.0
    container_name: mysql-produit
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service_produit
    ports:
      - "3308:3306"
    volumes:
      - mysql_data_produit:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ms-net]

  service-produit:   # ⚠️ doit rester avec le tiret
    build: .
    container_name: service-produit   # ⚠️ correspond au target Prometheus
    depends_on:
      mysql-produit:
        condition: service_healthy

    env_file:
      - C:/Users/epsiap/secrets/.env.jwt

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-produit:3306/service_produit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8082
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      FILE_UPLOAD_DIR: /app/uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB

    ports:
      - "8083:8080"   # ✅ API externe uniquement
      # pas de mapping 8082 → réservé à Prometheus
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks: [ms-net]

volumes:
  mysql_data_produit:

networks:
  ms-net:
    external: true
