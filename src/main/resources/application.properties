spring.application.name=service-produit

# --- Datasource MySQL (Docker) ---
spring.datasource.url=jdbc:mysql://mysql:3306/service_produit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root

# --- Pool Hikari (optionnel mais conseillé) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080

# --- JWT (remplace par ta vraie clé via variable d'env) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# management.endpoints.web.base-path=/actuator   # (par défaut déjà /actuator)

### Utilisation de RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# JSON automatique
spring.rabbitmq.template.mandatory=true

# où stocker les fichiers (dossier créé auto, relatif au jar)
file.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

